name: Build Qt 6 Static (MinGW)

on:
  workflow_dispatch: # Memungkinkan Anda menjalankan build ini secara manual lewat tombol di GitHub

jobs:
  build:
    runs-on: windows-2022 # Menggunakan server Windows Server 2022 resmi dari GitHub

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Ninja & Tools
      run: |
        choco install ninja
        # GitHub Windows Runner sudah menyertakan MinGW, CMake, dan Python secara default

    - name: Download Qt Source Code
      shell: bash
      run: |
        echo "Mengunduh Qt 6.11.1 Source..."
        curl -L -o qt-src.zip https://download.qt.io/official_releases/qt/6.11/6.11.1/single/qt-everywhere-src-6.11.1.zip
        echo "Mengekstrak Source (Proses ini agak memakan waktu)..."
        unzip -q qt-src.zip
        mv qt-everywhere-src-6.11.1 qt-src
        rm qt-src.zip

    - name: Set up MinGW Environment
      shell: cmd
      run: |
        echo C:\ProgramData\Chocolatey\bin>> %GITHUB_PATH%
        echo C:\msys64\mingw64\bin>> %GITHUB_PATH%

    - name: Configure Qt (Static & Minimalis)
      shell: cmd
      run: |
        mkdir qt-build
        cd qt-build
        ..\qt-src\configure.bat -static -static-runtime -release -opensource -confirm-license -prefix "%GITHUB_WORKSPACE%\qt6-static-msvc" -nomake examples -nomake tests -cmake-generator Ninja

    - name: Compile & Install Qt Static
      shell: cmd
      run: |
        cd qt-build
        cmake --build . --parallel
        cmake --install .

    - name: Compress Build Result (High Compression)
      shell: cmd
      run: |
        echo "Mengompresi hasil build dengan 7-Zip mode Ultra..."
        7z a -mx=9 qt6-static-msvc.7z qt6-static-msvc

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qt6.11.1-static-mingw
        path: qt6.11.1-static-mingw.7z
        retention-days: 7
